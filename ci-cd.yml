name: Pyraclaw CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  Pyraclaw_VERSION: '18.0.0'

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install black isort flake8 mypy pylint
          
      - name: Check code formatting (Black)
        run: black --check src/ tests/
        
      - name: Check import order (isort)
        run: isort --check-only src/ tests/
        
      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503
        
      - name: Run mypy type checking
        run: mypy src/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install package in development mode
        run: pip install -e .
        
      - name: Run pytest
        run: |
          pytest tests/ -v --cov=src/ --cov-report=xml --cov-report=term-missing
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest-benchmark
      
      - name: Run benchmarks
        run: pytest tests/ --benchmark-only --benchmark-compare --benchmark-json=benchmark_results.json
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install documentation dependencies
        run: pip install sphinx sphinx-rtd-theme myst-parser
        
      - name: Build documentation
        run: |
          sphinx-build -b html docs/ docs/_build/
          
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install security tools
        run: pip install safety bandit
        
      - name: Run safety check
        run: safety check -r requirements.txt --ignore=0 --output=text || true
        
      - name: Run bandit
        run: bandit -r src/ -f txt -o bandit_report.txt || true
        
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit_report.txt

  release:
    name: Release Package
    runs-on: ubuntu-latest
    needs: [lint, test, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install build tools
        run: pip install build twine wheel
        
      - name: Build package
        run: python -m build
        
      - name: Upload to PyPI
        uses: pypa/gh-release-publish@v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          python_version: ${{ env.PYTHON_VERSION }}
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, test, benchmark, docs, security]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "All jobs completed. Check the workflow run for details."
